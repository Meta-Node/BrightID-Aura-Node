services:
  ws:
    build: web_services
    depends_on:
      - db
    network_mode: host
    image: brightid/web_services
    env_file:
      - config.env
    expose:
      - 3000
    restart: unless-stopped

  scorer:
    build: scorer
    depends_on:
      - ws
      - db
    network_mode: host
    image: brightid/scorer
    volumes:
      - type: volume
        source: snapshots
        target: /snapshots
    env_file:
      - config.env
    environment:
      - INIT_BRIGHTID_DB
    restart: unless-stopped

  consensus_receiver:
    build: consensus
    depends_on:
      - ws
      - db
    network_mode: host
    image: brightid/consensus
    volumes:
      - type: volume
        source: snapshots
        target: /snapshots
    env_file:
      - config.env
    environment:
      RUN_TYPE: "RECEIVER"
    restart: unless-stopped

  consensus_sender:
    build: consensus
    depends_on:
      - ws
      - db
    network_mode: host
    image: brightid/consensus
    env_file:
      - config.env
    environment:
      RUN_TYPE: "SENDER"
    restart: unless-stopped

  updater:
    build: updater
    depends_on:
      - db
    network_mode: host
    image: brightid/updater
    env_file:
      - config.env
    restart: unless-stopped

  db:
    build: db
    network_mode: host
    image: brightid/db
    volumes:
      - "data:/var/lib/arangodb3"
      - "apps:/var/lib/arangodb3-apps"
    env_file:
      - config.env
    environment:
      - INIT_BRIGHTID_DB
    expose:
      - 8529
    restart: unless-stopped

  web:
    image: nginx
    volumes:
      - ./web/brightid-nginx.conf:/etc/nginx/nginx.conf
      - ./web/index.html:/var/www/html/index.html
    network_mode: host
    env_file:
      - config.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  snapshots:
  data:
  apps:
